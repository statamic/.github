name: Pull Requests

# Credit: https://github.com/github/docs/blob/main/.github/workflows/notify-when-maintainers-cannot-edit.yaml
#         https://github.com/laravel/.github/blob/main/.github/workflows/pull-requests.yml

on:
  workflow_call:

permissions: {}

jobs:
  uneditable: # zizmor: ignore[anonymous-definition]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # post comment and close PRs that don't allow maintainer edits
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const repo = context.repo.repo;

            const query = `
              query($number: Int!) {
                repository(owner: "statamic", name: "${repo}") {
                  pullRequest(number: $number) {
                    headRepositoryOwner {
                      __typename
                      login
                    }
                    maintainerCanModify
                    state
                  }
                }
              }
            `;

            const pullNumber = context.issue.number;
            const variables = { number: pullNumber };

            try {
              console.log(`Check for maintainer edit access ...`);
              const result = await github.graphql(query, variables);
              console.log(JSON.stringify(result, null, 2));
              const pullRequest = result.repository.pullRequest;

              if (pullRequest.headRepositoryOwner.login === 'statamic') {
                console.log('PR owned by statamic');
                return;
              }

              if (pullRequest.state !== 'OPEN') {
                 console.log('PR has already been closed or merged');
                 return;
              }

              const isOrganizationFork = pullRequest.headRepositoryOwner.__typename === 'Organization';

              if (isOrganizationFork || !pullRequest.maintainerCanModify) {
                const body = isOrganizationFork
                  ? "Thanks for submitting a PR!\n\nIn order to review and merge PRs most efficiently, we require that all PRs grant maintainer edit access before we review them. GitHub doesn't allow maintainer edits on PRs from forks owned by organizations, even when \"Allow edits by maintainers\" is checked. Please resubmit this PR from a fork on your personal GitHub account with maintainer edits enabled. For more information, [see the relevant GitHub documentation](https://docs.github.com/en/github/collaborating-with-pull-requests/working-with-forks/allowing-changes-to-a-pull-request-branch-created-from-a-fork)."
                  : "Thanks for submitting a PR!\n\nIn order to review and merge PRs most efficiently, we require that all PRs grant maintainer edit access before we review them. For information on how to do this, [see the relevant GitHub documentation](https://docs.github.com/en/github/collaborating-with-pull-requests/working-with-forks/allowing-changes-to-a-pull-request-branch-created-from-a-fork). Additionally, GitHub doesn't allow maintainer permissions from organization accounts. Please resubmit this PR from a personal GitHub account with maintainer permissions enabled.";

                console.log(isOrganizationFork
                  ? 'PR is from a fork owned by an organization, which does not allow maintainer edits'
                  : 'PR not owned by statamic and does not have maintainer edits enabled');

                await github.rest.issues.createComment({
                  issue_number: pullNumber,
                  owner: 'statamic',
                  repo,
                  body,
                });

                await github.rest.pulls.update({
                  pull_number: pullNumber,
                  owner: 'statamic',
                  repo,
                  state: 'closed'
                });
              }
            } catch(e) {
              console.log(e);
            }
